<!doctype html>
<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fbfbf9;--fg:#1d1d1b;--mut:#6b6b66;--line:#e2e1db;--card:#fff;--acc:#1d6e56;--acc-bg:#1d6e5614;--warn:#8a4b0b;--warn-bg:#8a4b0b14;--shadow:0 1px 2px rgba(20,20,19,.04),0 8px 24px rgba(20,20,19,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141413;--fg:#eceae2;--mut:#97958d;--line:#2c2c2a;--card:#1c1c1a;--acc:#5dcaa5;--acc-bg:#5dcaa51c;--warn:#efa727;--warn-bg:#efa7271c;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.3)
}}
:root[data-theme=dark]{
  --bg:#141413;--fg:#eceae2;--mut:#97958d;--line:#2c2c2a;--card:#1c1c1a;--acc:#5dcaa5;--acc-bg:#5dcaa51c;--warn:#efa727;--warn-bg:#efa7271c;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.3)
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
header{display:flex;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
h1{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 4px 0 0;white-space:nowrap}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px}
nav button{font:inherit;font-size:13px;background:none;border:0;color:var(--mut);padding:5px 11px;border-radius:6px;cursor:pointer;transition:color .12s,background .12s}
nav button:hover{color:var(--fg)}
nav button[aria-current=true]{color:var(--fg);background:var(--bg);box-shadow:var(--shadow)}
input[type=search]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg);min-width:180px;transition:border-color .12s}
input[type=search]:focus{outline:none;border-color:var(--acc)}
label.sw{color:var(--mut);font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
button.ghost{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:5px 9px;cursor:pointer;line-height:1}
button.ghost:hover{color:var(--fg);border-color:var(--mut)}
.spacer{flex:1}
main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2fr);gap:0;min-height:calc(100vh - 53px)}
#list{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 53px);padding:10px 0}
#detail{padding:20px 24px;overflow:auto;max-height:calc(100vh - 53px)}
.grp{padding:12px 16px 5px;color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.grp.top{color:var(--fg);font-size:12px}
.row{display:block;width:calc(100% - 12px);margin:1px 6px;text-align:left;font:inherit;font-size:14px;background:none;border:0;border-radius:7px;color:inherit;padding:7px 10px;cursor:pointer;transition:background .1s}
.row:hover{background:var(--card)}
.row[aria-current=true]{background:var(--acc-bg);box-shadow:inset 2px 0 0 var(--acc)}
.row .k{color:var(--mut);font-size:11.5px;margin-left:7px}
.row.fail .k{color:var(--warn)}
.row.gap{color:var(--warn);background:var(--warn-bg);white-space:normal;line-height:1.5}
.frame{border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;margin:4px 0 16px}
.dots{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line)}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
iframe{display:block;width:100%;height:600px;border:0;background:#fff}
dl{display:grid;grid-template-columns:max-content 1fr;gap:9px 18px;margin:16px 0}
dt{color:var(--mut);font-size:13px}
dd{margin:0}
.gate{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin:12px 0;font-size:14px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut);margin-right:6px}
.pill.stat{color:var(--fg);background:var(--card)}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
code{font:12px/1.5 ui-monospace,monospace;background:var(--card);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:4px 0 10px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
ul{margin:6px 0;padding-left:18px}
.landing{color:var(--mut);max-width:46em}
.landing h2{color:var(--fg)}
.landing .stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.landing kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--card)}
::selection{background:var(--acc-bg)}
</style>
<header>
  <h1>__TITLE__</h1>
  <nav>
    <button data-view="journey" aria-current="true">Journeys</button>
    <button data-view="group">Groups</button>
    <button data-view="ia">IA</button>
    <button data-view="failures">Failures</button>
    <button data-view="decisions">Decisions</button>
  </nav>
  <input type="search" id="q" placeholder="Search screens  /">
  <label class="sw"><input type="checkbox" id="happy"> Happy path only</label>
  <span class="spacer"></span>
  <span id="count" class="pill stat"></span>
  <button class="ghost" id="theme" title="Toggle light / dark">◐</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail"></div>
</main>
<script type="application/json" id="model">__DATA__</script>
__BOARDS__
<script>
const D = JSON.parse(document.getElementById('model').textContent);
const BOARDS = {};
document.querySelectorAll('script[data-board]').forEach(s => BOARDS[s.dataset.board] = s.textContent);
const byId = Object.fromEntries(D.screens.map(s => [s.id, s]));
const inbound = id => D.routes.filter(r => r.to === id);
const outbound = id => D.routes.filter(r => r.from === id);
const isFail = id => !!D.failures[id];
let view = 'journey', current = null, happy = false, query = '';

const happySet = new Set();
D.journeys.forEach(j => j.steps.forEach(st => (st.screens || []).forEach(s => {
  if (!isFail(s)) happySet.add(s);
})));

function visible(id) {
  if (happy && !happySet.has(id)) return false;
  if (!query) return true;
  const s = byId[id] || {};
  return (id + ' ' + (s.title || '') + ' ' + (D.rationale[id] || '')).toLowerCase().includes(query);
}

function row(id) {
  const s = byId[id]; if (!s) return '';
  return `<button class="row${isFail(id) ? ' fail' : ''}" data-id="${id}" aria-current="${current === id}">
    ${s.title || id}<span class="k">${s.kind}${isFail(id) ? ' · failure' : ''}</span></button>`;
}

function renderList() {
  const L = document.getElementById('list');
  let h = '';
  if (view === 'journey') {
    for (const j of D.journeys) {
      const steps = j.steps.map(st => {
        const ids = (st.screens || []).filter(visible);
        const gap = D.gaps[`${j.id}/${st.id}`];
        if (!ids.length && !gap) return '';
        return `<div class="grp">${st.name || st.id}</div>` + ids.map(row).join('') +
          (gap ? `<div class="row gap">nothing serves this — ${gap}</div>` : '');
      }).join('');
      if (steps) h += `<div class="grp top">${j.name || j.id}</div>` + steps;
    }
  } else if (view === 'group') {
    const g = {};
    D.screens.filter(s => visible(s.id)).forEach(s => (g[s.group || 'ungrouped'] ||= []).push(s.id));
    for (const k of Object.keys(g).sort()) h += `<div class="grp">${k}</div>` + g[k].map(row).join('');
  } else if (view === 'ia') {
    for (const p of D.screens.filter(s => s.kind === 'place' && visible(s.id))) {
      h += row(p.id);
      h += D.screens.filter(s => s.parent === p.id && visible(s.id))
        .map(s => `<div style="padding-left:14px">${row(s.id)}</div>`).join('');
    }
    const loose = D.screens.filter(s => ['detour', 'entrance'].includes(s.kind) && visible(s.id));
    if (loose.length) h += `<div class="grp">detours and entrances</div>` + loose.map(s => row(s.id)).join('');
  } else if (view === 'failures') {
    h += `<div class="grp">failure register</div>`;
    h += Object.keys(D.failures).filter(visible).map(row).join('');
  } else {
    h += `<div class="grp">decisions</div>`;
    h += D.decisions.map(d => `<button class="row" data-dec="${d.id}">${d.question}
      <span class="k">${d.status}</span></button>`).join('');
  }
  L.innerHTML = h || '<div class="grp">nothing matches</div>';
  document.getElementById('count').textContent =
    `${D.counts.screens} screens · ${D.counts.routes} routes bind`;
}

function renderDetail() {
  const el = document.getElementById('detail');
  if (view === 'decisions' && current && current.startsWith('d-')) {
    const d = D.decisions.find(x => x.id === current);
    el.innerHTML = `<h2>${d.question}</h2><p>${d.context || ''}</p>` +
      d.options.map(o => `<p><strong>${o.label}</strong><br>buys ${o.buys}<br>costs ${o.costs}` +
        (o.kills ? `<br>kills ${o.kills}` : '') + `</p>`).join('') +
      `<dl><dt>Chosen</dt><dd>${d.chosen || '—'}</dd><dt>Right if</dt><dd>${d.right_if || '—'}</dd>
       <dt>Status</dt><dd>${d.status}</dd></dl>`;
    return;
  }
  const id = current; const s = byId[id];
  if (!s) {
    const c = D.counts;
    el.innerHTML = `<div class="landing">
      <h2>${document.title}</h2>
      <p>${c.screens} screens across ${D.journeys.length} journeys, ${c.routes} declared routes, all bound.
      Pick a screen on the left, or press <kbd>/</kbd> to search.</p>
      <div class="stats">
        <span class="pill stat">${c.failure_states} failure state${c.failure_states === 1 ? '' : 's'}</span>
        <span class="pill stat">${c.open_decisions} open decision${c.open_decisions === 1 ? '' : 's'}</span>
        <span class="pill stat">${c.recorded_gaps} recorded gap${c.recorded_gaps === 1 ? '' : 's'}</span>
        <span class="pill stat">${c.places_without_an_empty_state} place${c.places_without_an_empty_state === 1 ? '' : 's'} with no empty state</span>
      </div>
      <p>Every rationale on the right came out of the generator that built its screen — not a
      separate document. Nothing here was drawn twice.</p>
    </div>`;
    return;
  }
  const step = (() => {
    for (const j of D.journeys) for (const st of j.steps)
      if ((st.screens || []).includes(id)) return `${j.name || j.id} · ${st.name || st.id}`;
    return 'not in the agreed scope';
  })();
  const inv = (BOARDS[id] || '').match(/data-component="([^"]+)"/g) || [];
  const gate = s.unagreed ? `<div class="gate">The scope document has not seen this. ${s.unagreed}</div>` : '';
  el.innerHTML = `<h2>${s.title || id} <span class="pill">${s.kind}</span>${s.parent ? `<span class="pill">under ${s.parent}</span>` : ''}</h2>
  ${gate}
  <div class="frame">
    <div class="dots"><i></i><i></i><i></i></div>
    <iframe srcdoc="${(BOARDS[id] || '').replace(/"/g, '&quot;')}"></iframe>
  </div>
  <dl>
    <dt>Where in the scope</dt><dd>${step}</dd>
    <dt>Why it is like this</dt><dd>${D.rationale[id] || '<em>no rationale — this is a finding</em>'}</dd>
    <dt>Leads here</dt><dd>${inbound(id).map(r => `${r.from || 'system'} <code>${r.via}</code> ${r.label || r.gesture || ''}`).join('<br>') || '—'}</dd>
    <dt>Leads away</dt><dd>${outbound(id).map(r => `${r.label || r.gesture} → ${r.to} <code>${r.via}</code>`).join('<br>') || '—'}</dd>
    <dt>Made of</dt><dd>${[...new Set(inv.map(m => m.split('"')[1]))].join(', ') || '—'}</dd>
    ${isFail(id) ? `<dt>Failure clause</dt><dd>${D.failures[id]}</dd>` : ''}
  </dl>`;
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v) { view = v.dataset.view; current = null;
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-current', b === v));
    renderList(); renderDetail(); return; }
  const r = e.target.closest('[data-id],[data-dec]');
  if (r) { current = r.dataset.id || r.dataset.dec; location.hash = current; renderList(); renderDetail(); }
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value.toLowerCase(); renderList(); });
document.getElementById('happy').addEventListener('change', e => { happy = e.target.checked; renderList(); });
addEventListener('keydown', e => {
  if (e.key === '/' && e.target.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus(); }
  if (e.key === 'Escape') { document.getElementById('q').value = ''; query = ''; renderList(); }
});
addEventListener('hashchange', () => { current = location.hash.slice(1); renderList(); renderDetail(); });

const THEME_KEY = 'measured-design-viewer-theme';
const themeBtn = document.getElementById('theme');
// file:// pages can throw on localStorage access (Chrome denies it by origin policy);
// the toggle still works for the session, it just forgets on reload there.
const store = { get: () => { try { return localStorage.getItem(THEME_KEY); } catch { return null; } },
                 set: v => { try { localStorage.setItem(THEME_KEY, v); } catch {} } };
function applyTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '●' : t === 'light' ? '○' : '◐';
  themeBtn.title = `Theme: ${t} (click to change)`;
}
let theme = store.get() || 'system';
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  theme = { system: 'light', light: 'dark', dark: 'system' }[theme];
  store.set(theme);
  applyTheme(theme);
});

current = location.hash.slice(1) || null;
renderList(); renderDetail();
</script>

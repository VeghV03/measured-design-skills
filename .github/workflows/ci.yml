name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-gate-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Library — every vendored skill must be reachable from a stage
        run: python3 scaffold/check_library.py

      - name: Build examples/demo with the Python adapter
        working-directory: examples/demo
        run: python3 ../../scaffold/adapters/python/build.py --boards boards --model model

      - name: Gate — a route that does not bind must stop the build
        working-directory: examples/demo
        run: python3 ../../scaffold/gate.py --model model --boards boards

      - name: Build the same demo with the Node adapter, prove the contract holds
        run: |
          mkdir -p /tmp/node-boards /tmp/node-model
          cp examples/demo/model/*.json /tmp/node-model/
          rm -f /tmp/node-model/rationale.json /tmp/node-model/index.json
          node scaffold/adapters/node/build.mjs --boards /tmp/node-boards --model /tmp/node-model
          python3 scaffold/gate.py --model /tmp/node-model --boards /tmp/node-boards
          python3 - <<'PY'
          import json, sys
          a = json.load(open("examples/demo/model/rationale.json"))
          b = json.load(open("/tmp/node-model/rationale.json"))
          if a != b:
              print("rationale.json differs between the Python and Node adapters:")
              for k in sorted(set(a) | set(b)):
                  if a.get(k) != b.get(k):
                      print(f"  {k}:\n    python: {a.get(k)!r}\n    node:   {b.get(k)!r}")
              sys.exit(1)
          print(f"rationale.json identical across both adapters ({len(a)} screens)")
          PY

      - name: Build with the React adapter, prove all three agree
        run: |
          mkdir -p /tmp/react-boards /tmp/react-model /tmp/react-components
          cp examples/demo/model/*.json /tmp/react-model/
          rm -f /tmp/react-model/rationale.json /tmp/react-model/index.json
          node scaffold/adapters/react/build.mjs \
            --boards /tmp/react-boards --model /tmp/react-model --components /tmp/react-components
          python3 scaffold/gate.py --model /tmp/react-model --boards /tmp/react-boards
          python3 - <<'PY'
          import json, sys
          ref = json.load(open("examples/demo/model/rationale.json"))
          rea = json.load(open("/tmp/react-model/rationale.json"))
          if ref != rea:
              print("rationale.json differs between the Python and React adapters:")
              for k in sorted(set(ref) | set(rea)):
                  if ref.get(k) != rea.get(k):
                      print(f"  {k}:\n    python: {ref.get(k)!r}\n    react:  {rea.get(k)!r}")
              sys.exit(1)
          print(f"rationale.json identical across all three adapters ({len(ref)} screens)")
          PY

      - name: Typecheck the emitted components (dev-only toolchain)
        working-directory: scaffold/adapters/react
        run: |
          npm install
          npm run typecheck

      - name: Install harness dependencies
        working-directory: scaffold/harnesses
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run all twelve harnesses against examples/demo
        working-directory: scaffold/harnesses
        run: |
          cat > harness.config.json <<'EOF'
          {
            "target": { "mode": "dir", "dir": "../../examples/demo/boards" },
            "model": "../../examples/demo/model",
            "widths": [1440, 1024, 768],
            "height": 900,
            "executablePath": null,
            "scrimSelector": ".scrim",
            "cellChildSelector": ".chip",
            "ignoreSelectors": ["code", "pre", "[data-verbatim]"]
          }
          EOF
          node run-all.mjs


      - name: CLI — init and check against a throwaway project
        run: |
          set -e
          rm -rf /tmp/fixture && mkdir -p /tmp/fixture/dist
          cat > /tmp/fixture/package.json <<'JSON'
          { "name": "fixture", "private": true, "devDependencies": { "vite": "^5.0.0" } }
          JSON
          cat > /tmp/fixture/dist/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>Home</title></head>
          <body style="font-family:system-ui"><h1>Home</h1>
          <p style="color:#ccc">Pale text nobody can read.</p>
          <a href="/index.html">Home again</a> <a href="/gone.html">Archive</a>
          </body></html>
          HTML

          cd /tmp/fixture
          node "$GITHUB_WORKSPACE/cli/measured-design.mjs" init > /tmp/cli.txt 2>&1 || { cat /tmp/cli.txt; exit 1; }
          test -f measured-design.config.json
          grep -q "no <html lang>"                                /tmp/cli.txt
          grep -qE "[1-9][0-9]* boards with a contrast failure"    /tmp/cli.txt
          grep -q "links needs a served origin"                    /tmp/cli.txt
          grep -q "12 checks · 0 errored"                          /tmp/cli.txt
          # a check that cannot run must say so, not read as a clean pass
          grep -q "2 skipped"                                      /tmp/cli.txt
          # the run writes its findings down, so the next run can tell new from known
          test -s .measured-design/findings.json
          python3 -c "import json,sys; d=json.load(open('.measured-design/findings.json')); sys.exit(0 if d['findings'] else 1)"
          echo "  dir mode ok"

          # "/" and "/index.html" are one page; a dead link must be reported once
          ( cd dist && python3 -m http.server 8099 >/dev/null 2>&1 & echo $! > /tmp/f.pid )
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8099/ && break; sleep 1; done
          cat > measured-design.config.json <<'JSON'
          { "target": { "mode": "crawl", "start": "http://localhost:8099/", "limit": 25 },
            "widths": [1440], "height": 900, "densityBudget": 400, "targetSize": 24 }
          JSON
          node "$GITHUB_WORKSPACE/cli/measured-design.mjs" check > /tmp/crawl.txt 2>&1 || true
          kill "$(cat /tmp/f.pid)" 2>/dev/null || true
          grep -q "1 links that do not resolve" /tmp/crawl.txt || {
            echo "expected exactly one unresolved link"; grep -A3 "links" /tmp/crawl.txt; exit 1; }
          echo "  crawl mode ok"

      - name: Backlog — the plan resolves, emits, and does not duplicate itself
        run: |
          set -e
          B="python3 scaffold/backlog/build_backlog.py"

          # Standalone first: a plan written from a brief, with no model/ anywhere.
          $B --plan examples/standalone-backlog/backlog.plan.json \
             --config examples/standalone-backlog/backlog.config.json --out /tmp/sa > /tmp/sa.txt
          cat /tmp/sa.txt
          grep -q "2 epics · 6 stories · 10 sub-tasks · 1 spike" /tmp/sa.txt
          grep -q "1 with nothing serving it" /tmp/sa.txt
          test -f /tmp/sa/jira.csv && test -f /tmp/sa/backlog.md
          echo "  standalone plan ok"

          # The spike must be ranked before the story it blocks, because row order is
          # the only build sequence a Jira CSV can carry.
          python3 - <<'PY'
          import json
          u = {x["key"]: x for x in json.load(open("/tmp/sa/backlog.json"))["units"]}
          assert u["spike:tax-fields"]["rank"] < u["story:set-up/details"]["rank"], "spike must outrank what it blocks"
          assert "spike:tax-fields" in u["story:set-up/details"]["blocked_by"]
          assert u["story:get-paid/chase"]["rank"] > u["story:get-paid/send"]["rank"]
          print("  build order ok")
          PY

          # Same emitter, the richer front end.
          $B --model examples/demo/model --config examples/demo/backlog.config.json \
             --out /tmp/md1 --title "File manager" > /tmp/m1.txt
          grep -q "4 epics · 9 stories · 10 sub-tasks · 2 spikes" /tmp/m1.txt
          echo "  model front end ok"

          # Deterministic: same input, byte-identical output.
          $B --model examples/demo/model --config examples/demo/backlog.config.json \
             --out /tmp/md2 --title "File manager" > /dev/null
          for f in backlog.json jira.csv backlog.md; do cmp /tmp/md1/$f /tmp/md2/$f; done
          echo "  deterministic"

          # Re-run into the same directory must report nothing and duplicate nothing.
          $B --model examples/demo/model --config examples/demo/backlog.config.json \
             --out /tmp/md1 --title "File manager" > /tmp/m2.txt
          if grep -qE "^  (added|changed|gone) " /tmp/m2.txt; then
            echo "an unchanged re-run must report nothing"; cat /tmp/m2.txt; exit 1; fi
          echo "  re-run is quiet"

          # A reworded story keeps its ticket; only a restructure makes new work.
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/j.json")
          d = json.load(open("examples/demo/model/journeys.json"))
          for j in d:
              if j["id"] == "manage":
                  for s in j["steps"]:
                      if s["id"] == "move":
                          s["name"] = "Move a file into a folder without sharing it"
          p.write_text(json.dumps(d))
          PY
          cp examples/demo/model/journeys.json /tmp/j-orig.json
          cp /tmp/j.json examples/demo/model/journeys.json
          $B --model examples/demo/model --config examples/demo/backlog.config.json \
             --out /tmp/md1 --title "File manager" > /tmp/m3.txt
          cp /tmp/j-orig.json examples/demo/model/journeys.json
          grep -q "changed  S-manage-move" /tmp/m3.txt
          if grep -q "added    S-manage" /tmp/m3.txt; then
            echo "a rename must not create a new ticket"; cat /tmp/m3.txt; exit 1; fi
          echo "  rename keeps identity"

          # A plan that does not resolve is refused by name, not emitted with a hole.
          cat > /tmp/bad.json <<'JSON'
          {"version":1,"epics":[{"id":"a","name":"A"}],
           "stories":[{"id":"a/one","epic":"a","name":"One","blocked_by":["a/nope"]}]}
          JSON
          set +e; $B --plan /tmp/bad.json --out /tmp/bad > /tmp/bad.txt 2>&1; code=$?; set -e
          test "$code" = "1" || { echo "a dangling reference must stop the build"; cat /tmp/bad.txt; exit 1; }
          grep -q "is blocked by story:a/nope, which is not declared" /tmp/bad.txt
          echo "  dangling reference refused"

          cat > /tmp/cyc.json <<'JSON'
          {"version":1,"epics":[{"id":"a","name":"A"}],
           "stories":[{"id":"a/one","epic":"a","name":"One","blocked_by":["a/two"]},
                      {"id":"a/two","epic":"a","name":"Two","blocked_by":["a/one"]}]}
          JSON
          set +e; $B --plan /tmp/cyc.json --out /tmp/cyc > /tmp/cyc.txt 2>&1; code=$?; set -e
          test "$code" = "1" || { echo "a cycle must stop the build"; exit 1; }
          grep -q "blocked-by cycle" /tmp/cyc.txt
          echo "  blocked-by cycle refused"

          # push is the only part that reaches outside. Its guards are tested against
          # a stubbed Jira rather than trusted: no network, no tickets, every rule real.
          python3 scaffold/backlog/push_test.py

          # and it must refuse to create anything with no terminal to confirm at
          set +e
          python3 scaffold/backlog/build_backlog.py --model examples/demo/model \
            --config examples/demo/backlog.config.json --out /tmp/np --push < /dev/null > /tmp/np.txt 2>&1
          code=$?
          set -e
          test "$code" = "1" || { echo "push must fail without credentials or a terminal"; cat /tmp/np.txt; exit 1; }
          grep -q "STOP" /tmp/np.txt
          echo "  push refuses in a non-interactive shell"

      - name: Ratchet — a baselined finding is quiet, a new one refuses
        run: |
          set -e
          cd /tmp/fixture
          MD="node $GITHUB_WORKSPACE/cli/measured-design.mjs"
          cat > measured-design.config.json <<'JSON'
          { "target": { "mode": "dir", "dir": "./dist" },
            "widths": [1440], "height": 900, "densityBudget": 400, "targetSize": 24 }
          JSON

          $MD baseline > /tmp/base.txt 2>&1 || { cat /tmp/base.txt; exit 1; }
          grep -q "Recorded" /tmp/base.txt
          test -f measured-design.baseline.json
          echo "  baseline written"

          # The same findings, now known: the ratchet must be silent and exit 0.
          $MD check --no-new > /tmp/r1.txt 2>&1 || { echo "a baselined run must pass"; cat /tmp/r1.txt; exit 1; }
          grep -q "0 new" /tmp/r1.txt
          echo "  baselined run passes"

          # A screen nobody measured before, carrying exactly one finding nobody
          # accepted. It declares a lang so the heading is the only thing new —
          # the assertions below are about the ratchet, not about the page.
          cat > dist/settings.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Settings</title></head>
          <body style="font-family:system-ui"><div>Settings</div></body></html>
          HTML
          set +e; $MD check --no-new > /tmp/r2.txt 2>&1; code=$?; set -e
          test "$code" = "1" || { echo "a new finding must fail, got exit $code"; cat /tmp/r2.txt; exit 1; }
          grep -q "new since the baseline" /tmp/r2.txt
          grep -q "structure · settings: no heading element" /tmp/r2.txt
          echo "  new finding refuses"

          # A recorded decision is accepted; an unexplained one is not.
          FP=$(grep "structure · settings: no heading element" /tmp/r2.txt | awk '{print $1}')
          test -n "$FP"
          $MD waive "$FP" --why "Fixture screen, heading lands with the redesign" --until 2999-01-01
          $MD check --no-new > /tmp/r3.txt 2>&1 || { echo "a waived finding must pass"; cat /tmp/r3.txt; exit 1; }
          grep -q "1 waived" /tmp/r3.txt
          echo "  waiver accepted"

          set +e; $MD waive deadbeefcafe > /tmp/r4.txt 2>&1; code=$?; set -e
          test "$code" = "2" || { echo "a waiver with no --why must be refused, got exit $code"; exit 1; }
          grep -q "an opinion that won" /tmp/r4.txt
          echo "  waiver without a reason refused"

          # An expired waiver brings its finding straight back.
          python3 - <<'PY'
          import json
          p = "measured-design.waivers.json"
          d = json.load(open(p))
          for w in d["waivers"]: w["until"] = "2020-01-01"
          json.dump(d, open(p, "w"), indent=2)
          PY
          set +e; $MD check --no-new > /tmp/r5.txt 2>&1; code=$?; set -e
          test "$code" = "1" || { echo "an expired waiver must stop protecting, got exit $code"; cat /tmp/r5.txt; exit 1; }
          grep -q "waiver expired" /tmp/r5.txt
          echo "  expired waiver refuses again"
